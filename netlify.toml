[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/main.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# data.js is owner-edited content (specials, hours, sauces) — it must never be
# cached as immutable or edits won't reach returning visitors.
[[headers]]
  for = "/assets/js/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/sanity-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
